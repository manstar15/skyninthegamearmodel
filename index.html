<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Model</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  body { margin: 0; background: #111; font-family: sans-serif; }
  model-viewer { width: 100vw; height: 100vh; height: 100dvh; }
  #ar-btn { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
    background: #fff; color: #000; border: none; border-radius: 40px;
    padding: 24px 56px; font-size: 28px; font-weight: bold;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  #msg { display: none; position: fixed; bottom: 15%; left: 0; right: 0;
    text-align: center; color: #fff; font-size: 18px; padding: 0 20px; }
</style>
</head>
<body>
<model-viewer id="mv" src="kid_coat.glb" ar ar-modes="webxr scene-viewer quick-look"
  ar-scale="fixed" camera-controls auto-rotate>
  <button slot="ar-button" id="ar-btn">📱 View in AR</button>
</model-viewer>
<div id="msg">This phone doesn't support AR, or Google Play Services for AR is missing</div>
<script>
  const mv = document.getElementById('mv');
  mv.addEventListener('load', () => {
    if (!mv.canActivateAR) document.getElementById('msg').style.display = 'block';
  });
</script>
</body>
</html>
